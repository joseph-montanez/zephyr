name: Build Linux

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, 'feature/swift-6.4' ]
  pull_request:
    branches: [ main ]

env:
  SDL3_VERSION: "3.4.18"
  SDL3_TTF_VERSION: "3.2.2"
  SDL3_IMAGE_VERSION: "3.4.8"
  ZLIB_NG_VERSION: "2.3.3"
  PDFIUM_TAG: "chromium%2F7891"
  SWIFT_VERSION: "6.4.1"
  DXC_VERSION: "v1.8.2407"
  DXC_ASSET: "linux_dxc_2024_07_31.x86_64.tar.gz"
  DEV_ROOT: "~/dev"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-22.04
            pdfium_asset: pdfium-linux-x64.tgz
            zip_name: Zephyr-Linux-x64.zip
            appimage_arch: x86_64
            appimage_name: Zephyr-Linux-x64.AppImage
            flatpak_arch: x86_64
            bundle_name: Zephyr-Linux-x64.flatpak
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            pdfium_asset: pdfium-linux-arm64.tgz
            zip_name: Zephyr-Linux-arm64.zip
            appimage_arch: aarch64
            appimage_name: Zephyr-Linux-arm64.AppImage
            flatpak_arch: aarch64
            bundle_name: Zephyr-Linux-arm64.flatpak

    defaults:
      run:
        shell: bash

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # 2. Install system build dependencies
      # ------------------------------------------------------------------
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y \
            build-essential git cmake ninja-build pkg-config \
            glslang-tools \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libthai-dev \
            libudev-dev libusb-1.0-0-dev libfribidi-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libdecor-0-dev liburing-dev \
            libvulkan-dev \
            libpng-dev libjpeg-dev libwebp-dev libtiff-dev \
            libfreetype-dev libharfbuzz-dev

      # ------------------------------------------------------------------
      # 3. Install Swift
      # ------------------------------------------------------------------
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      # ------------------------------------------------------------------
      # 3b. Verify Swift toolchain (fail fast, not with 90 cryptic errors)
      # ------------------------------------------------------------------
      - name: Verify Swift Version
        run: |
          swift --version
          swift --version 2>&1 | grep -q "Swift version ${SWIFT_VERSION%.*}" \
            || { echo "ERROR: Zephyr requires Swift $SWIFT_VERSION (see SWIFT_VERSION env)"; exit 1; }

      # ------------------------------------------------------------------
      # 4. Build SDL3, SDL3_image, SDL3_ttf from pinned releases
      # ------------------------------------------------------------------
      - name: Build SDL3
        run: |
          DEV_ROOT_EXPANDED="${DEV_ROOT/#\~/$HOME}"
          SDL_ROOT="$DEV_ROOT_EXPANDED/SDL3"
          mkdir -p "$SDL_ROOT"
          # Let SDL_image/SDL_ttf find the just-built SDL3
          export CMAKE_PREFIX_PATH="$SDL_ROOT"

          build_sdl() {
            local repo="$1" asset="$2" version="$3" extra_flags="$4"
            local tarball="$RUNNER_TEMP/${asset}-${version}.tar.gz"
            local srcdir="$RUNNER_TEMP/${asset}-${version}-src"
            local builddir="$RUNNER_TEMP/${asset}-${version}-build"

            echo "=== Building $asset $version ==="
            curl -sSL -o "$tarball" \
              "https://github.com/libsdl-org/${repo}/releases/download/release-${version}/${asset}-${version}.tar.gz"
            rm -rf "$srcdir" "$builddir"
            mkdir -p "$srcdir"
            tar xzf "$tarball" -C "$srcdir" --strip-components=1
            # shellcheck disable=SC2086
            cmake -S "$srcdir" -B "$builddir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$SDL_ROOT" \
              -DBUILD_SHARED_LIBS=ON $extra_flags
            cmake --build "$builddir"
            cmake --install "$builddir"
          }

          build_sdl "SDL" "SDL3" "$SDL3_VERSION" "-DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF"
          build_sdl "SDL_image" "SDL3_image" "$SDL3_IMAGE_VERSION" "-DSDLIMAGE_VENDORED=OFF -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF"
          build_sdl "SDL_ttf" "SDL3_ttf" "$SDL3_TTF_VERSION" "-DSDLTTF_VENDORED=OFF -DSDLTTF_PLUTOSVG=OFF"

          echo "--- SDL3 install contents ---"
          ls "$SDL_ROOT/include" "$SDL_ROOT/lib"/libSDL3*.so*

      # ------------------------------------------------------------------
      # 5. Build zlib-ng from pinned release
      # ------------------------------------------------------------------
      - name: Build zlib-ng
        run: |
          DEV_ROOT_EXPANDED="${DEV_ROOT/#\~/$HOME}"
          ZLIB_ROOT="$DEV_ROOT_EXPANDED/zlib-ng"
          mkdir -p "$ZLIB_ROOT"

          curl -sSL -o "$RUNNER_TEMP/zlib-ng.tar.gz" \
            "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/$ZLIB_NG_VERSION.tar.gz"
          rm -rf "$RUNNER_TEMP/zlib-ng-src" "$RUNNER_TEMP/zlib-ng-build"
          mkdir -p "$RUNNER_TEMP/zlib-ng-src"
          tar xzf "$RUNNER_TEMP/zlib-ng.tar.gz" -C "$RUNNER_TEMP/zlib-ng-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/zlib-ng-src" -B "$RUNNER_TEMP/zlib-ng-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ZLIB_ROOT" \
            -DBUILD_SHARED_LIBS=ON \
            -DZLIB_COMPAT=OFF \
            -DBUILD_TESTING=OFF \
            -DWITH_GTEST=OFF
          cmake --build "$RUNNER_TEMP/zlib-ng-build"
          cmake --install "$RUNNER_TEMP/zlib-ng-build"

          ls "$ZLIB_ROOT/lib"/libz-ng.so*

      # ------------------------------------------------------------------
      # 6. Download PDFium (runtime-optional, dlopen'd by the app)
      # ------------------------------------------------------------------
      - name: Download PDFium
        run: |
          DEV_ROOT_EXPANDED="${DEV_ROOT/#\~/$HOME}"
          PDFIUM_ROOT="$DEV_ROOT_EXPANDED/pdfium"
          mkdir -p "$PDFIUM_ROOT"
          curl -sSL -o "$RUNNER_TEMP/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/${{ matrix.pdfium_asset }}"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$PDFIUM_ROOT"
          find "$PDFIUM_ROOT" -name "libpdfium.so"

      # ------------------------------------------------------------------
      # 7. Download DXC (HLSL -> SPIR-V shader compiler; x64 only)
      # ------------------------------------------------------------------
      - name: Download DXC
        if: matrix.arch == 'x64'
        run: |
          DEV_ROOT_EXPANDED="${DEV_ROOT/#\~/$HOME}"
          DXC_ROOT="$DEV_ROOT_EXPANDED/dxc"
          mkdir -p "$DXC_ROOT"
          curl -sSL -o "$RUNNER_TEMP/dxc.tar.gz" \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_VERSION/$DXC_ASSET"
          tar xzf "$RUNNER_TEMP/dxc.tar.gz" -C "$DXC_ROOT"
          DXC_BIN="$(find "$DXC_ROOT" -name dxc -type f | head -n 1)"
          [ -n "$DXC_BIN" ] || { echo "dxc binary not found under $DXC_ROOT"; exit 1; }
          chmod +x "$DXC_BIN"
          echo "DXC_BIN=$DXC_BIN" >> "$GITHUB_ENV"
          # dxc carries $ORIGIN/../lib RPATH, so no LD_LIBRARY_PATH is needed.
          "$DXC_BIN" --version

      # ------------------------------------------------------------------
      # 8. Build Engine with compile-linux.sh
      # ------------------------------------------------------------------
      - name: Build Engine
        run: |
          DEV_ROOT_EXPANDED="${DEV_ROOT/#\~/$HOME}"
          export DXC="$DXC_BIN"
          FLAGS=""
          if [ "${{ inputs.configuration || 'release' }}" = "release" ]; then
            FLAGS="--release"
          fi
          # shellcheck disable=SC2086
          ./Engine/EngineAsBuilt/compile-linux.sh $FLAGS "$DEV_ROOT_EXPANDED"

      # ------------------------------------------------------------------
      # 8b. Swift 6.4 canary + DXF golden digests (mirrors win/mac 7b/6b)
      # ------------------------------------------------------------------
      - name: Swift 6.4 canary and DXF goldens
        run: |
          cd Engine/EngineAsBuilt
          BENCH="$(find .build -name "ZephyrBench" -type f | head -n 1)"
          if [ -z "$BENCH" ]; then
            echo "::warning::ZephyrBench binary not found - skipping canary and goldens"
            exit 0
          fi

          echo "=== Swift 6.4 feature canary (Linux ${{ matrix.arch }}) ==="
          "$BENCH" canary

          echo "=== DXF parser golden digests ==="
          "$BENCH" dxf-goldens Tools/bench/golden

      # ------------------------------------------------------------------
      # 9. Verify standalone: every dependency must resolve (bundled or OS)
      # ------------------------------------------------------------------
      - name: Verify Standalone Linking
        run: |
          cd Engine/EngineAsBuilt
          BIN_DIR="$(swift build -c "${{ inputs.configuration || 'release' }}" --show-bin-path)"
          echo "Binary dir: $BIN_DIR"
          MISSING="$(ldd "$BIN_DIR/Zephyr" | grep "not found" || true)"
          if [ -n "$MISSING" ]; then
            echo "Standalone check failed - unresolved libraries:"
            echo "$MISSING"
            exit 1
          fi
          echo "Standalone check OK - all libraries resolve."
          ldd "$BIN_DIR/Zephyr" | grep -E "libSDL3|libz-ng" || true

      # ------------------------------------------------------------------
      # 10. Package for distribution
      # ------------------------------------------------------------------
      - name: Package Build
        run: |
          cd Engine/EngineAsBuilt
          BIN_DIR="$(swift build -c "${{ inputs.configuration || 'release' }}" --show-bin-path)"
          ZIP_NAME="${{ matrix.zip_name }}"
          STAGE_DIR="$RUNNER_TEMP/pkg-linux-${{ matrix.arch }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          echo "Staging from: $BIN_DIR"
          cp "$BIN_DIR/Zephyr" "$STAGE_DIR/"
          cp "$BIN_DIR"/libSDL3*.so* "$STAGE_DIR/"
          cp "$BIN_DIR"/libz-ng.so* "$STAGE_DIR/"
          cp "$BIN_DIR"/libpdfium.so "$STAGE_DIR/" 2>/dev/null || echo "(no libpdfium.so)"
          cp "$BIN_DIR"/*.spv "$STAGE_DIR/"
          for asset in "Fonts" "Plot Styles" "Patterns" "lisp"; do
            if [ -d "$BIN_DIR/$asset" ]; then
              cp -R "$BIN_DIR/$asset" "$STAGE_DIR/"
            fi
          done

          # SwiftPM resource bundle for ZephyrCore (hatch Patterns), next to
          # the executable. The app also finds the plain Patterns/ folder.
          for bundle in "Zephyr_ZephyrCore.bundle" "Zephyr_ZephyrCore.resources"; do
            if [ -d "$BIN_DIR/$bundle" ]; then
              cp -R "$BIN_DIR/$bundle" "$STAGE_DIR/"
            fi
          done

          echo "--- Staged files ---"
          find "$STAGE_DIR" -maxdepth 1 | sort

          (cd "$STAGE_DIR" && zip -r "$RUNNER_TEMP/$ZIP_NAME" .)
          ls -lh "$RUNNER_TEMP/$ZIP_NAME"

      # ------------------------------------------------------------------
      # 10b. Package AppImage
      # ------------------------------------------------------------------
      - name: Package AppImage
        run: |
          cd Engine/EngineAsBuilt
          BIN_DIR="$(swift build -c "${{ inputs.configuration || 'release' }}" --show-bin-path)"
          APPDIR="$RUNNER_TEMP/Zephyr.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/icons/hicolor/scalable/apps" \
                   "$APPDIR/usr/share/metainfo"

          # 1. Copy application executable, shaders, and assets into AppDir
          cp -L "$BIN_DIR/Zephyr" "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/Zephyr"
          ln -sf Zephyr "$APPDIR/usr/bin/zephyr"
          cp -L "$BIN_DIR"/libSDL3*.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libSDL3*.so* "$APPDIR/usr/bin/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libz-ng.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libz-ng.so* "$APPDIR/usr/bin/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libpdfium.so "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libpdfium.so "$APPDIR/usr/bin/" 2>/dev/null || true
          cp -L "$BIN_DIR"/*.spv "$APPDIR/usr/bin/"
          for asset in "Fonts" "Plot Styles" "Patterns" "lisp"; do
            if [ -d "$BIN_DIR/$asset" ]; then
              cp -R "$BIN_DIR/$asset" "$APPDIR/usr/bin/"
            fi
          done

          # SwiftPM resource bundle for ZephyrCore (hatch Patterns), next to
          # the executable. The app also finds the plain Patterns/ folder.
          for bundle in "Zephyr_ZephyrCore.bundle" "Zephyr_ZephyrCore.resources"; do
            if [ -d "$BIN_DIR/$bundle" ]; then
              cp -R "$BIN_DIR/$bundle" "$APPDIR/usr/bin/"
            fi
          done

          # 2. Bundle Swift runtime libraries and ICU dependencies
          SWIFT_ROOT="$(dirname "$(dirname "$(which swift)")")"
          SWIFT_LIB_DIR="$(find "$SWIFT_ROOT" -name "libswiftCore.so" -type f -exec dirname {} \; | head -n 1)"
          echo "Found Swift runtime at: $SWIFT_LIB_DIR"
          if [ -n "$SWIFT_LIB_DIR" ]; then
            for lib in libswift*.so* libFoundation*.so* libdispatch.so* libBlocksRuntime.so* lib_FoundationICU.so*; do
              cp -L "$SWIFT_LIB_DIR"/$lib "$APPDIR/usr/lib/" 2>/dev/null || true
              cp -L "$SWIFT_LIB_DIR"/$lib "$APPDIR/usr/bin/" 2>/dev/null || true
            done
          fi
          # Also bundle system ICU libraries for maximum distro compatibility
          cp -L /usr/lib/*-linux-gnu/libicu*.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -L /usr/lib/*-linux-gnu/libicu*.so* "$APPDIR/usr/bin/" 2>/dev/null || true

          # 3. Desktop integration and metadata
          cd "$GITHUB_WORKSPACE"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp packaging/shared/com.zephyr.cad.desktop "$APPDIR/com.zephyr.cad.desktop"
          cp packaging/shared/com.zephyr.cad.desktop "$APPDIR/zephyr.desktop"
          cp packaging/shared/com.zephyr.cad.desktop "$APPDIR/usr/share/applications/com.zephyr.cad.desktop"

          cp snap/gui/zephyr.png "$APPDIR/com.zephyr.cad.png"
          cp snap/gui/zephyr.png "$APPDIR/zephyr.png"
          cp snap/gui/zephyr.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/com.zephyr.cad.png"
          cp snap/gui/zephyr.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/com.zephyr.cad.svg"
          ln -sf com.zephyr.cad.png "$APPDIR/.DirIcon"

          cp packaging/shared/com.zephyr.cad.metainfo.xml "$APPDIR/usr/share/metainfo/com.zephyr.cad.metainfo.xml"

          # 4. Download and run appimagetool
          APPIMAGE_ARCH="${{ matrix.appimage_arch }}"
          TOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          echo "Downloading appimagetool from: $TOOL_URL"
          curl -sSL -o "$RUNNER_TEMP/appimagetool" "$TOOL_URL"
          chmod +x "$RUNNER_TEMP/appimagetool"

          echo "Extracting appimagetool..."
          (cd "$RUNNER_TEMP" && rm -rf squashfs-root && ./appimagetool --appimage-extract >/dev/null)

          echo "Building AppImage: ${{ matrix.appimage_name }}"
          ARCH="$APPIMAGE_ARCH" "$RUNNER_TEMP/squashfs-root/AppRun" "$APPDIR" "$RUNNER_TEMP/${{ matrix.appimage_name }}"
          ls -lh "$RUNNER_TEMP/${{ matrix.appimage_name }}"

      # ------------------------------------------------------------------
      # 10c. Prepare & Upload Staged Payload for Flatpak
      # ------------------------------------------------------------------
      - name: Stage Payload for Flatpak
        run: |
          cd Engine/EngineAsBuilt
          BIN_DIR="$(swift build -c "${{ inputs.configuration || 'release' }}" --show-bin-path)"
          STAGE_PAYLOAD="$RUNNER_TEMP/staged-payload-${{ matrix.arch }}"
          rm -rf "$STAGE_PAYLOAD"
          mkdir -p "$STAGE_PAYLOAD"

          # Executable, C libs, shaders, assets
          cp -L "$BIN_DIR/Zephyr" "$STAGE_PAYLOAD/"
          cp -L "$BIN_DIR"/libSDL3*.so* "$STAGE_PAYLOAD/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libz-ng.so* "$STAGE_PAYLOAD/" 2>/dev/null || true
          cp -L "$BIN_DIR"/libpdfium.so "$STAGE_PAYLOAD/" 2>/dev/null || true
          cp -L "$BIN_DIR"/*.spv "$STAGE_PAYLOAD/"
          for asset in "Fonts" "Plot Styles" "Patterns" "lisp"; do
            if [ -d "$BIN_DIR/$asset" ]; then
              cp -R "$BIN_DIR/$asset" "$STAGE_PAYLOAD/"
            fi
          done

          # SwiftPM resource bundle for ZephyrCore (hatch Patterns), next to
          # the executable. The app also finds the plain Patterns/ folder.
          for bundle in "Zephyr_ZephyrCore.bundle" "Zephyr_ZephyrCore.resources"; do
            if [ -d "$BIN_DIR/$bundle" ]; then
              cp -R "$BIN_DIR/$bundle" "$STAGE_PAYLOAD/"
            fi
          done

          # Swift runtime libs
          SWIFT_ROOT="$(dirname "$(dirname "$(which swift)")")"
          SWIFT_LIB_DIR="$(find "$SWIFT_ROOT" -name "libswiftCore.so" -type f -exec dirname {} \; | head -n 1)"
          if [ -n "$SWIFT_LIB_DIR" ]; then
            for lib in libswift*.so* libFoundation*.so* libdispatch.so* libBlocksRuntime.so* lib_FoundationICU.so*; do
              cp -L "$SWIFT_LIB_DIR"/$lib "$STAGE_PAYLOAD/" 2>/dev/null || true
            done
          fi

          # Desktop files and icons
          cd "$GITHUB_WORKSPACE"
          cp packaging/shared/com.zephyr.cad.desktop "$STAGE_PAYLOAD/"
          cp packaging/shared/com.zephyr.cad.metainfo.xml "$STAGE_PAYLOAD/"
          cp snap/gui/zephyr.png "$STAGE_PAYLOAD/"
          cp snap/gui/zephyr.svg "$STAGE_PAYLOAD/"

          echo "Payload contents:"
          ls -lh "$STAGE_PAYLOAD"

      - name: Upload Staged Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staged-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/staged-payload-${{ matrix.arch }}
          retention-days: 1

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appimage_name }}
          path: ${{ runner.temp }}/${{ matrix.appimage_name }}
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 11. Upload to Nightly Release
      # ------------------------------------------------------------------
      - name: Upload to Nightly Release
        # Only publish from `main`. The workflow now also runs on branch pushes and pull requests
        # (see the `on:` block), and without this guard a branch build would move the `nightly`
        # tag and overwrite the public download with unreleased code.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly builds from `main` branch.

            See [downloads page](https://joseph-montanez.github.io/zephyr/#download) for all platforms.
          files: |
            ${{ runner.temp }}/${{ matrix.zip_name }}
            ${{ runner.temp }}/${{ matrix.appimage_name }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    name: flatpak ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    needs: build
    if: (inputs.configuration || 'release') == 'release' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
            flatpak_arch: x86_64
            bundle_name: Zephyr-Linux-x64.flatpak
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            flatpak_arch: aarch64
            bundle_name: Zephyr-Linux-arm64.flatpak

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Staged Payload
        uses: actions/download-artifact@v4
        with:
          name: staged-linux-${{ matrix.arch }}
          path: packaging/flatpak/payload

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ matrix.bundle_name }}
          manifest-path: packaging/flatpak/com.zephyr.cad.yml
          arch: ${{ matrix.flatpak_arch }}
          cache: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle_name }}
          path: ${{ matrix.bundle_name }}
          if-no-files-found: error

      - name: Upload Flatpak to Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly builds from `main` branch.

            See [downloads page](https://joseph-montanez.github.io/zephyr/#download) for all platforms.
          files: ${{ matrix.bundle_name }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snap:
    name: snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    # Snaps are distribution artifacts: release builds from `main` only.
    # Push/PR runs carry no inputs.configuration, so default to release and
    # gate on the branch (a branch/PR snap build would move the `nightly` tag).
    if: (inputs.configuration || 'release') == 'release' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload snap to Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly builds from `main` branch.

            See [downloads page](https://joseph-montanez.github.io/zephyr/#download) for all platforms.
          files: ${{ steps.snapcraft.outputs.snap }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
