name: Build macOS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, 'feature/swift-6.4' ]
  pull_request:
    branches: [ main ]

env:
  SWIFT_VERSION: "6.4.1"
  PDFIUM_TAG: "chromium%2F7891"
  SDL3_VERSION: "3.4.18"
  SDL3_IMAGE_VERSION: "3.4.8"
  SDL3_TTF_VERSION: "3.2.2"
  ZLIB_NG_VERSION: "2.3.3"

jobs:
  build:
    name: Universal (ARM64 + x64)
    runs-on: macos-15

    defaults:
      run:
        shell: bash

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # 2. Install Swift
      # ------------------------------------------------------------------
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.4.1'

      # ------------------------------------------------------------------
      # 3. Download Official SDL3 Frameworks (Universal: ARM64 + x64)
      # ------------------------------------------------------------------
      - name: Download SDL3 Frameworks
        run: |
          FRAMEWORKS_DIR="$HOME/dev/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"

          extract_dmg_framework() {
            local url="$1"
            local name="$2"
            local dmg_path="$RUNNER_TEMP/${name}.dmg"
            local mount_point="$RUNNER_TEMP/mount_${name}"

            echo "=== Downloading $name from $url ==="
            curl -L -o "$dmg_path" "$url"
            mkdir -p "$mount_point"
            hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"

            # Check for .xcframework with macos slice, or direct .framework
            if [ -d "$mount_point/${name}.xcframework/macos-arm64_x86_64/${name}.framework" ]; then
              cp -R "$mount_point/${name}.xcframework/macos-arm64_x86_64/${name}.framework" "$FRAMEWORKS_DIR/"
            elif [ -d "$mount_point/${name}.framework" ]; then
              cp -R "$mount_point/${name}.framework" "$FRAMEWORKS_DIR/"
            else
              found_fw=$(find "$mount_point" -name "${name}.framework" -print -quit)
              if [ -n "$found_fw" ]; then
                cp -R "$found_fw" "$FRAMEWORKS_DIR/"
              else
                echo "ERROR: ${name}.framework not found in DMG"
                hdiutil detach "$mount_point" || true
                exit 1
              fi
            fi

            hdiutil detach "$mount_point"
            echo "Extracted ${name}.framework to $FRAMEWORKS_DIR"
          }

          extract_dmg_framework "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.dmg" "SDL3"
          extract_dmg_framework "https://github.com/libsdl-org/SDL_image/releases/download/release-$SDL3_IMAGE_VERSION/SDL3_image-$SDL3_IMAGE_VERSION.dmg" "SDL3_image"
          extract_dmg_framework "https://github.com/libsdl-org/SDL_ttf/releases/download/release-$SDL3_TTF_VERSION/SDL3_ttf-$SDL3_TTF_VERSION.dmg" "SDL3_ttf"

          # Create dylib symlinks so `-lSDL3` and module maps link directly
          ln -sf "$FRAMEWORKS_DIR/SDL3.framework/SDL3" "$FRAMEWORKS_DIR/libSDL3.dylib"
          ln -sf "$FRAMEWORKS_DIR/SDL3_image.framework/SDL3_image" "$FRAMEWORKS_DIR/libSDL3_image.dylib"
          ln -sf "$FRAMEWORKS_DIR/SDL3_ttf.framework/SDL3_ttf" "$FRAMEWORKS_DIR/libSDL3_ttf.dylib"

          # Create header search structure for C module maps
          mkdir -p "$FRAMEWORKS_DIR/include/SDL3"
          cp -RL "$FRAMEWORKS_DIR/SDL3.framework/Headers/"* "$FRAMEWORKS_DIR/include/SDL3/"
          mkdir -p "$FRAMEWORKS_DIR/include/SDL3_image"
          cp -RL "$FRAMEWORKS_DIR/SDL3_image.framework/Headers/"* "$FRAMEWORKS_DIR/include/SDL3_image/"
          mkdir -p "$FRAMEWORKS_DIR/include/SDL3_ttf"
          cp -RL "$FRAMEWORKS_DIR/SDL3_ttf.framework/Headers/"* "$FRAMEWORKS_DIR/include/SDL3_ttf/"

          echo "Verify SDL.h exists in include:"
          ls -l "$FRAMEWORKS_DIR/include/SDL3/SDL.h"

          echo "Framework architectures:"
          lipo -info "$FRAMEWORKS_DIR/SDL3.framework/SDL3"
          lipo -info "$FRAMEWORKS_DIR/SDL3_image.framework/SDL3_image"
          lipo -info "$FRAMEWORKS_DIR/SDL3_ttf.framework/SDL3_ttf"

      # ------------------------------------------------------------------
      # 4. Build Universal zlib-ng (Static)
      # ------------------------------------------------------------------
      - name: Build Universal zlib-ng
        run: |
          ZLIB_NG_ROOT="$HOME/dev/zlib-ng"
          ZLIB_NG_SRC="$RUNNER_TEMP/zlib-ng-src"
          mkdir -p "$ZLIB_NG_ROOT"

          git clone --depth 1 --branch "$ZLIB_NG_VERSION" https://github.com/zlib-ng/zlib-ng.git "$ZLIB_NG_SRC"

          # 1. Build ARM64 slice & install headers
          echo "=== Building zlib-ng (arm64) ==="
          cmake -S "$ZLIB_NG_SRC" -B "$RUNNER_TEMP/zlib-ng-arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_COMPAT=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$ZLIB_NG_ROOT"

          cmake --build "$RUNNER_TEMP/zlib-ng-arm64" --config Release --target install

          # 2. Build x86_64 slice
          echo "=== Building zlib-ng (x86_64) ==="
          cmake -S "$ZLIB_NG_SRC" -B "$RUNNER_TEMP/zlib-ng-x64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_COMPAT=OFF \
            -DBUILD_TESTING=OFF

          cmake --build "$RUNNER_TEMP/zlib-ng-x64" --config Release

          # 3. Merge thin static archives into a universal fat archive using lipo
          LIB_ARM64=$(find "$RUNNER_TEMP/zlib-ng-arm64" -name "libz-ng.a" -print -quit)
          LIB_X64=$(find "$RUNNER_TEMP/zlib-ng-x64" -name "libz-ng.a" -print -quit)

          echo "Merging $LIB_ARM64 and $LIB_X64 into $ZLIB_NG_ROOT/lib/libz-ng.a..."
          lipo -create -output "$ZLIB_NG_ROOT/lib/libz-ng.a" "$LIB_ARM64" "$LIB_X64"

          echo "Universal zlib-ng static library:"
          ls -lh "$ZLIB_NG_ROOT/lib/libz-ng.a"
          lipo -info "$ZLIB_NG_ROOT/lib/libz-ng.a"

      # ------------------------------------------------------------------
      # 5. Download & Merge Universal PDFium (ARM64 + x64)
      # ------------------------------------------------------------------
      - name: Download & Merge PDFium
        run: |
          PDFIUM_ROOT="$HOME/dev/pdfium"
          mkdir -p "$PDFIUM_ROOT/include" "$PDFIUM_ROOT/lib"

          ARM64_URL="https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-mac-arm64.tgz"
          X64_URL="https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-mac-x64.tgz"

          curl -L -o "$RUNNER_TEMP/pdfium-arm64.tgz" "$ARM64_URL"
          curl -L -o "$RUNNER_TEMP/pdfium-x64.tgz" "$X64_URL"

          mkdir -p "$RUNNER_TEMP/pdfium-arm64" "$RUNNER_TEMP/pdfium-x64"
          tar -xzf "$RUNNER_TEMP/pdfium-arm64.tgz" -C "$RUNNER_TEMP/pdfium-arm64"
          tar -xzf "$RUNNER_TEMP/pdfium-x64.tgz" -C "$RUNNER_TEMP/pdfium-x64"

          DYLIB_ARM64=$(find "$RUNNER_TEMP/pdfium-arm64" -name "libpdfium.dylib" -print -quit)
          DYLIB_X64=$(find "$RUNNER_TEMP/pdfium-x64" -name "libpdfium.dylib" -print -quit)

          if [ -n "$DYLIB_ARM64" ] && [ -n "$DYLIB_X64" ]; then
            echo "Merging PDFium arm64 and x64 with lipo..."
            lipo -create -output "$PDFIUM_ROOT/lib/libpdfium.dylib" "$DYLIB_ARM64" "$DYLIB_X64"
            install_name_tool -id "@rpath/libpdfium.dylib" "$PDFIUM_ROOT/lib/libpdfium.dylib"
            lipo -info "$PDFIUM_ROOT/lib/libpdfium.dylib"
          else
            echo "WARNING: libpdfium.dylib not found in archives"
          fi

          HEADER=$(find "$RUNNER_TEMP/pdfium-arm64" -name "fpdfview.h" -print -quit)
          if [ -n "$HEADER" ]; then
            cp -R "$(dirname "$HEADER")/"* "$PDFIUM_ROOT/include/"
          fi

      # ------------------------------------------------------------------
      # 6. Build Engine (Universal Binary)
      # ------------------------------------------------------------------
      - name: Build Engine
        run: |
          CONFIG="${{ inputs.configuration || 'release' }}"
          FRAMEWORKS_DIR="$HOME/dev/Frameworks"
          ZLIB_NG_ROOT="$HOME/dev/zlib-ng"
          PDFIUM_ROOT="$HOME/dev/pdfium"

          export SDL3_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_LIB="$FRAMEWORKS_DIR"
          export SDL3_IMAGE_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_IMAGE_LIB="$FRAMEWORKS_DIR"
          export SDL3_TTF_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_TTF_LIB="$FRAMEWORKS_DIR"
          export SDL3_FRAMEWORK_DIR="$FRAMEWORKS_DIR"
          export ZLIB_NG_INCLUDE="$ZLIB_NG_ROOT/include"
          export ZLIB_NG_LIB="$ZLIB_NG_ROOT/lib"
          export CPATH="$FRAMEWORKS_DIR/include:$ZLIB_NG_ROOT/include"
          export LIBRARY_PATH="$FRAMEWORKS_DIR:$ZLIB_NG_ROOT/lib"
          export MACOSX_DEPLOYMENT_TARGET=12.0

          if [ -d "$PDFIUM_ROOT/include" ]; then
            export PDFIUM_INCLUDE="$PDFIUM_ROOT/include"
            export CPATH="$CPATH:$PDFIUM_ROOT/include"
          fi

          SWIFT_FLAGS=(
            -Xswiftc -I"$FRAMEWORKS_DIR/include"
            -Xswiftc -F"$FRAMEWORKS_DIR"
            -Xcc -I"$FRAMEWORKS_DIR/include"
            -Xcc -F"$FRAMEWORKS_DIR"
            -Xlinker -F"$FRAMEWORKS_DIR"
            -Xlinker -L"$FRAMEWORKS_DIR"
            -Xlinker -L"$ZLIB_NG_ROOT/lib"
          )

          cd Engine/EngineAsBuilt
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/.swiftpm
          rm -rf .build

          echo "=== Building Engine (arm64) ==="
          swift build -c "$CONFIG" --arch arm64 --build-path .build/arm64 "${SWIFT_FLAGS[@]}"

          echo "=== Building Engine (x86_64) ==="
          swift build -c "$CONFIG" --arch x86_64 --build-path .build/x86_64 "${SWIFT_FLAGS[@]}"

          EXEC_ARM64=$(find .build/arm64 -name "Zephyr" -type f | grep -v "\.dSYM" | head -n 1)
          EXEC_X64=$(find .build/x86_64 -name "Zephyr" -type f | grep -v "\.dSYM" | head -n 1)

          if [ -z "$EXEC_ARM64" ] || [ -z "$EXEC_X64" ]; then
            echo "ERROR: Failed to locate Zephyr binaries for both architectures"
            echo "ARM64: $EXEC_ARM64"
            echo "x64: $EXEC_X64"
            exit 1
          fi

          echo "Merging $EXEC_ARM64 and $EXEC_X64 into universal binary..."
          mkdir -p .build/universal
          lipo -create -output .build/universal/Zephyr "$EXEC_ARM64" "$EXEC_X64"

          echo "Universal binary created successfully:"
          lipo -info .build/universal/Zephyr

      # ------------------------------------------------------------------
      # 6b. Swift 6.4 canary + perf baseline (host arch only)
      # ------------------------------------------------------------------
      - name: Swift 6.4 canary and perf baseline
        run: |
          CONFIG="${{ inputs.configuration || 'release' }}"
          FRAMEWORKS_DIR="$HOME/dev/Frameworks"
          ZLIB_NG_ROOT="$HOME/dev/zlib-ng"

          export SDL3_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_LIB="$FRAMEWORKS_DIR"
          export SDL3_IMAGE_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_IMAGE_LIB="$FRAMEWORKS_DIR"
          export SDL3_TTF_INCLUDE="$FRAMEWORKS_DIR/include"
          export SDL3_TTF_LIB="$FRAMEWORKS_DIR"
          export SDL3_FRAMEWORK_DIR="$FRAMEWORKS_DIR"
          export ZLIB_NG_INCLUDE="$ZLIB_NG_ROOT/include"
          export ZLIB_NG_LIB="$ZLIB_NG_ROOT/lib"
          export DYLD_FRAMEWORK_PATH="$FRAMEWORKS_DIR"
          export DYLD_LIBRARY_PATH="$FRAMEWORKS_DIR:$ZLIB_NG_ROOT/lib"

          cd Engine/EngineAsBuilt
          BENCH=$(find .build/arm64 -name "ZephyrBench" -type f | head -n 1)
          if [ -z "$BENCH" ]; then
            echo "::warning::ZephyrBench binary not found - skipping canary and perf baseline"
            exit 0
          fi

          echo "=== Swift 6.4 feature canary (macOS, deployment target 12.0) ==="
          "$BENCH" canary

          echo "=== DXF parser golden digests ==="
          "$BENCH" dxf-goldens Tools/bench/golden

          echo "=== Perf baseline (macOS arm64) ==="
          "$BENCH" nurbs || true
          SHX=$(ls Fonts/*.SHX 2>/dev/null | head -n 1)
          if [ -n "$SHX" ]; then "$BENCH" shx "$SHX" || true; fi

      # ------------------------------------------------------------------
      # 7. Create .app Bundle
      # ------------------------------------------------------------------
      - name: Create .app Bundle
        run: |
          CONFIG="${{ inputs.configuration || 'release' }}"
          FRAMEWORKS_DIR="$HOME/dev/Frameworks"
          PDFIUM_ROOT="$HOME/dev/pdfium"

          cd Engine/EngineAsBuilt
          EXEC=".build/universal/Zephyr"
          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Universal Zephyr executable not found at $EXEC"
            exit 1
          fi

          BUILD_DIR=".build/universal"
          APP_NAME="Zephyr"
          APP_ROOT="$BUILD_DIR/$APP_NAME.app"
          APP_MACOS="$APP_ROOT/Contents/MacOS"
          APP_RESOURCES="$APP_ROOT/Contents/Resources"
          APP_FRAMEWORKS="$APP_ROOT/Contents/Frameworks"

          echo "=== Creating .app bundle at $APP_ROOT ==="
          rm -rf "$APP_ROOT"
          mkdir -p "$APP_MACOS" "$APP_RESOURCES" "$APP_FRAMEWORKS"

          # Copy executable
          cp "$EXEC" "$APP_MACOS/$APP_NAME"

          # Copy resources
          cp -R Fonts "$APP_RESOURCES/"
          cp -R "Plot Styles" "$APP_RESOURCES/" || true
          cp -R Patterns "$APP_RESOURCES/" || true
          cp -R lisp "$APP_RESOURCES/" || true
          cp Shaders/*.msl "$APP_RESOURCES/"

          # SwiftPM resource bundle for ZephyrCore (hatch Patterns). It lives
          # in the per-arch build dir, not next to the lipo'd universal
          # binary. The app also finds the plain Patterns/ folder above, but
          # ship the bundle too so Bundle resolution matches dev builds.
          BUNDLE_SRC=$(find .build/arm64 -name "Zephyr_ZephyrCore.bundle" -type d -print -quit)
          if [ -n "$BUNDLE_SRC" ]; then
            cp -R "$BUNDLE_SRC" "$APP_RESOURCES/"
            echo "Bundled: $BUNDLE_SRC"
          else
            echo "::warning::Zephyr_ZephyrCore.bundle not found under .build/arm64 - relying on plain Patterns/ folder"
          fi

          # Copy Frameworks
          echo "Copying frameworks..."
          cp -R "$FRAMEWORKS_DIR/SDL3.framework" "$APP_FRAMEWORKS/"
          cp -R "$FRAMEWORKS_DIR/SDL3_image.framework" "$APP_FRAMEWORKS/"
          cp -R "$FRAMEWORKS_DIR/SDL3_ttf.framework" "$APP_FRAMEWORKS/"

          # Copy PDFium if present
          if [ -f "$PDFIUM_ROOT/lib/libpdfium.dylib" ]; then
            cp "$PDFIUM_ROOT/lib/libpdfium.dylib" "$APP_FRAMEWORKS/"
            echo "PDFium dylib bundled."
          fi

          # Ensure @rpath is configured on the executable
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_MACOS/$APP_NAME" 2>/dev/null || true

          # Create Info.plist
          cat > "$APP_ROOT/Contents/Info.plist" << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>English</string>
            <key>CFBundleExecutable</key>
            <string>Zephyr</string>
            <key>CFBundleName</key>
            <string>Zephyr</string>
            <key>CFBundleIdentifier</key>
            <string>com.zephyr.cad</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLISTEOF

          echo "=== .app bundle structure ==="
          find "$APP_ROOT" -type f | sort

          # Ad-hoc sign inside-out: frameworks first, then bundle
          echo "--- Ad-hoc signing frameworks and app ---"
          codesign --force --sign - "$APP_FRAMEWORKS/SDL3.framework"
          codesign --force --sign - "$APP_FRAMEWORKS/SDL3_image.framework"
          codesign --force --sign - "$APP_FRAMEWORKS/SDL3_ttf.framework"
          if [ -f "$APP_FRAMEWORKS/libpdfium.dylib" ]; then
            codesign --force --sign - "$APP_FRAMEWORKS/libpdfium.dylib"
          fi
          codesign --force --deep --sign - "$APP_ROOT"
          echo "Signing complete."

      # ------------------------------------------------------------------
      # 8. Package .app for distribution
      # ------------------------------------------------------------------
      - name: Package .app
        run: |
          cd Engine/EngineAsBuilt
          BUILD_DIR=".build/universal"
          ZIP_NAME="Zephyr-macOS-Universal.zip"

          cd "$BUILD_DIR"
          zip -r "$RUNNER_TEMP/$ZIP_NAME" Zephyr.app
          # Also provide arm64 and x64 aliases for backwards compatibility with existing download links
          cp "$RUNNER_TEMP/$ZIP_NAME" "$RUNNER_TEMP/Zephyr-macOS-arm64.zip"
          cp "$RUNNER_TEMP/$ZIP_NAME" "$RUNNER_TEMP/Zephyr-macOS-x64.zip"

          echo "Created releases:"
          ls -lh "$RUNNER_TEMP"/Zephyr-macOS-*.zip

      # ------------------------------------------------------------------
      # 9. Upload to Nightly Release
      # ------------------------------------------------------------------
      - name: Upload to Nightly Release
        # Only publish from `main`. The workflow now also runs on branch pushes and pull requests
        # (see the `on:` block), and without this guard a branch build would move the `nightly`
        # tag and overwrite the public download with unreleased code.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly builds from `main` branch.

            See [downloads page](https://joseph-montanez.github.io/zephyr/#download) for all platforms.
          files: |
            ${{ runner.temp }}/Zephyr-macOS-Universal.zip
            ${{ runner.temp }}/Zephyr-macOS-arm64.zip
            ${{ runner.temp }}/Zephyr-macOS-x64.zip
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
